experiment:
  id: baseline_exp_001
  name: "Baseline LLM Hallucination Evaluation"

models_evaluated:
  - gpt-4o
  - gpt-4o-mini
  - o3
  - o3-mini
  - gpt-5
  - gpt-5-mini
  - gpt-5-nano

task:
  description: "Generate clinical notes from consultation transcripts and evaluate for hallucinations (addition, omission and contradiction)"
  
pipeline:
  transcript_metadata:
    description: "Extracted features from each transcript (length, complexity, speaker turns, etc.)"
    output_format: json 
    
  extracted_facts_generated_notes:
    description: "Atomic facts extracted from LLM-generated clinical notes for each model. The clinical notes used were the same as the notes generated in set 1"
    method: "Fact decomposition using GPT-4o"
    output_format: json
    
  eval_omissions:
    description: "Evaluation of omitted facts - information in true note but missing from clinical note"
    method:
      - facts from true notes compared with facts from generated notes
    metrics:
      - omission_count
      - omission_rate
    ground_truth: "Clinical Notes content"
    
  eval_additions_contradictions:
    description: "Evaluation of hallucinated content - additions (not in transcript) and contradictions (conflicts with transcript)"
    metod:
      - facts from generated clinical notes compared with raw transcript
    metrics:
      - addition_count
      - addition_rate  
      - contradiction_count
      - contradiction_rate
    ground_truth: "Transcript content"

evaluation_settings:
  temperature: 0
  num_runs: 1
